<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YouTube 動画統計</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, "Noto Sans JP", sans-serif;
    background: #f5f5f5;
    color: #222;
}

header {
    background: white;
    border-bottom: 1px solid #ddd;
    padding: 20px;
}

h1 {
    margin: 0 0 16px;
    font-size: 24px;
}

.settings {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

input {
    padding: 10px 12px;
    border: 1px solid #bbb;
    border-radius: 6px;
    font-size: 14px;
}

#apiKey {
    width: 360px;
}

#channelId {
    width: 320px;
}

button {
    padding: 10px 18px;
    border: 0;
    border-radius: 6px;
    background: #1976d2;
    color: white;
    cursor: pointer;
    font-size: 14px;
}

button:hover {
    background: #1565c0;
}

button:disabled {
    background: #aaa;
    cursor: wait;
}

main {
    max-width: 1200px;
    margin: 30px auto;
    padding: 0 20px;
}

.channel {
    background: white;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px #00000012;
}

.channel-name {
    font-size: 22px;
    font-weight: bold;
}

.subscribers {
    margin-top: 8px;
    color: #666;
}

.video-list {
    display: grid;
    gap: 14px;
}

.video {
    background: white;
    border-radius: 10px;
    padding: 14px;
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 16px;
    box-shadow: 0 2px 8px #00000012;
}

.thumbnail {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    border-radius: 7px;
    background: #ddd;
}

.title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
}

.info {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    color: #555;
    font-size: 14px;
}

.info span {
    white-space: nowrap;
}

.date {
    margin-top: 10px;
    color: #777;
    font-size: 13px;
}

.error {
    background: #ffebee;
    color: #b71c1c;
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 20px;
}

.loading {
    text-align: center;
    padding: 40px;
    color: #666;
}

@media (max-width: 700px) {
    .video {
        grid-template-columns: 1fr;
    }

    #apiKey,
    #channelId {
        width: 100%;
    }
}
</style>
</head>

<body>

<header>
    <h1>YouTube 動画統計</h1>

    <div class="settings">
        <input
            id="apiKey"
            type="password"
            placeholder="APIキー">

        <input
            id="channelId"
            type="text"
            placeholder="チャンネルID（UC...）">

        <button id="loadButton" onclick="loadChannel()">
            読み込み
        </button>
    </div>
</header>

<main>
    <div id="result"></div>
</main>

<script>

const API_BASE = "https://www.googleapis.com/youtube/v3";

async function apiRequest(endpoint, params) {
    const query = new URLSearchParams(params);

    const response =
        await fetch(`${API_BASE}/${endpoint}?${query}`);

    const data = await response.json();

    if (!response.ok) {
        throw new Error(
            data.error?.message || "APIリクエストに失敗した"
        );
    }

    return data;
}

function formatNumber(value) {
    return Number(value).toLocaleString("ja-JP");
}

function formatDate(dateString) {
    const date = new Date(dateString);

    return date.toLocaleDateString("ja-JP", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
    });
}

function daysSince(dateString) {
    const published = new Date(dateString);
    const now = new Date();

    const diff =
        now.getTime() - published.getTime();

    return Math.floor(diff / 86400000);
}

function formatDays(days) {
    if (days === 0) return "今日";
    if (days === 1) return "1日前";

    return `${days}日前`;
}

function escapeHtml(text) {
    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}

async function loadChannel() {
    const apiKey =
        document.getElementById("apiKey").value.trim();

    const channelId =
        document.getElementById("channelId").value.trim();

    const result =
        document.getElementById("result");

    const button =
        document.getElementById("loadButton");

    if (!apiKey || !channelId) {
        result.innerHTML = `
            <div class="error">
                APIキーとチャンネルIDを入力して
            </div>
        `;

        return;
    }

    button.disabled = true;

    result.innerHTML = `
        <div class="loading">
            YouTubeからデータを取得中...
        </div>
    `;

    try {
        const channelData =
            await apiRequest("channels", {
                part: "snippet,statistics,contentDetails",
                id: channelId,
                key: apiKey
            });

        if (
            !channelData.items ||
            channelData.items.length === 0
        ) {
            throw new Error(
                "チャンネルが見つからない"
            );
        }

        const channel =
            channelData.items[0];

        const uploadsPlaylistId =
            channel.contentDetails
                .relatedPlaylists.uploads;

        const playlistData =
            await apiRequest("playlistItems", {
                part: "snippet,contentDetails",
                playlistId: uploadsPlaylistId,
                maxResults: 50,
                key: apiKey
            });

        const videoIds =
            playlistData.items.map(item =>
                item.contentDetails.videoId
            );

        if (videoIds.length === 0) {
            throw new Error(
                "動画が見つからない"
            );
        }

        const videoData =
            await apiRequest("videos", {
                part: "snippet,statistics,contentDetails",
                id: videoIds.join(","),
                key: apiKey
            });

        const videos =
            videoData.items
                .filter(video => {
                    const title =
                        video.snippet.title.toLowerCase();

                    const description =
                        video.snippet.description
                            .toLowerCase();

                    const duration =
                        video.contentDetails.duration;

                    const isShortTag =
                        title.includes("#shorts") ||
                        description.includes("#shorts");

                    const seconds =
                        parseDuration(duration);

                    const isVeryShort =
                        seconds <= 60;

                    return (
                        !isShortTag &&
                        !isVeryShort
                    );
                })
                .sort((a, b) =>
                    new Date(b.snippet.publishedAt) -
                    new Date(a.snippet.publishedAt)
                )
                .slice(0, 20);

        renderChannel(channel);
        renderVideos(videos);

    } catch (error) {
        result.innerHTML = `
            <div class="error">
                <strong>エラー</strong><br>
                ${escapeHtml(error.message)}
            </div>
        `;
    } finally {
        button.disabled = false;
    }
}

function parseDuration(duration) {
    const match =
        duration.match(
            /PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/
        );

    if (!match) {
        return 0;
    }

    const hours =
        Number(match[1] || 0);

    const minutes =
        Number(match[2] || 0);

    const seconds =
        Number(match[3] || 0);

    return (
        hours * 3600 +
        minutes * 60 +
        seconds
    );
}

function renderChannel(channel) {
    const result =
        document.getElementById("result");

    result.innerHTML = `
        <div class="channel">
            <div class="channel-name">
                ${escapeHtml(
                    channel.snippet.title
                )}
            </div>

            <div class="subscribers">
                チャンネル登録者数：
                <strong>
                    ${formatNumber(
                        channel.statistics
                            .subscriberCount
                    )}
                </strong>
            </div>
        </div>

        <div
            class="video-list"
            id="videoList">
        </div>
    `;
}

function renderVideos(videos) {
    const list =
        document.getElementById("videoList");

    if (videos.length === 0) {
        list.innerHTML = `
            <div class="error">
                横動画として取得できる動画が見つからない
            </div>
        `;

        return;
    }

    list.innerHTML =
        videos.map((video, index) => {
            const statistics =
                video.statistics;

            const views =
                statistics.viewCount || 0;

            const likes =
                statistics.likeCount || 0;

            const publishedAt =
                video.snippet.publishedAt;

            const days =
                daysSince(publishedAt);

            const thumbnail =
                video.snippet.thumbnails.high?.url ||
                video.snippet.thumbnails.medium?.url ||
                video.snippet.thumbnails.default.url;

            return `
                <div class="video">

                    <a
                        href="https://www.youtube.com/watch?v=${video.id}"
                        target="_blank"
                        rel="noopener noreferrer">

                        <img
                            class="thumbnail"
                            src="${thumbnail}"
                            alt="">
                    </a>

                    <div>

                        <div class="title">
                            ${index + 1}.
                            ${escapeHtml(
                                video.snippet.title
                            )}
                        </div>

                        <div class="info">

                            <span>
                                ▶ 再生
                                <strong>
                                    ${formatNumber(
                                        views
                                    )}
                                </strong>
                            </span>

                            <span>
                                👍 高評価
                                <strong>
                                    ${formatNumber(
                                        likes
                                    )}
                                </strong>
                            </span>

                            <span>
                                📅
                                ${formatDays(days)}
                            </span>

                        </div>

                        <div class="date">
                            投稿日：
                            ${formatDate(
                                publishedAt
                            )}
                        </div>

                    </div>
                </div>
            `;
        }).join("");
}

</script>

</body>
</html>
