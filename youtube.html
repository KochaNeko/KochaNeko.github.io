<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YouTube 動画統計</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, "Noto Sans JP", sans-serif;
    background: #f5f5f5;
    color: #222;
}

header {
    background: white;
    border-bottom: 1px solid #ddd;
    padding: 20px;
}

h1 {
    margin: 0 0 16px;
    font-size: 24px;
}

.settings {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

input {
    padding: 10px 12px;
    border: 1px solid #bbb;
    border-radius: 6px;
    font-size: 14px;
}

#apiKey {
    width: 360px;
}

#channelId {
    width: 320px;
}

button {
    padding: 10px 18px;
    border: 0;
    border-radius: 6px;
    background: #1976d2;
    color: white;
    cursor: pointer;
    font-size: 14px;
}

button:hover {
    background: #1565c0;
}

button:disabled {
    background: #aaa;
    cursor: wait;
}

main {
    max-width: 1400px;
    margin: 30px auto;
    padding: 0 20px;
}

.channel {
    background: white;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px #00000012;
}

.channel-name {
    font-size: 22px;
    font-weight: bold;
}

.subscribers {
    margin-top: 8px;
    color: #666;
}

.video-list {
    display: grid;
    gap: 14px;
}

.video {
    background: white;
    border-radius: 10px;
    padding: 14px;
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 16px;
    box-shadow: 0 2px 8px #00000012;
}

.thumbnail {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    border-radius: 7px;
    background: #ddd;
}

.title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
}

.info {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    color: #555;
    font-size: 14px;
}

.info span {
    white-space: nowrap;
}

.date {
    margin-top: 10px;
    color: #777;
    font-size: 13px;
}

.gap {
    margin-top: 8px;
    color: #1976d2;
    font-weight: bold;
}

.error {
    background: #ffebee;
    color: #b71c1c;
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 20px;
}

.loading {
    text-align: center;
    padding: 40px;
    color: #666;
}

.chart-container {
    background: white;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px #00000012;
}

.chart-container h2 {
    margin-top: 0;
}

.chart-wrapper {
    position: relative;
    width: 100%;
    height: 500px;
}

@media (max-width: 700px) {
    .video {
        grid-template-columns: 1fr;
    }

    #apiKey,
    #channelId {
        width: 100%;
    }

    .chart-wrapper {
        height: 400px;
    }
}
</style>
</head>

<body>

<header>
    <h1>YouTube 動画統計</h1>

    <div class="settings">

        <input
            id="apiKey"
            type="password"
            placeholder="APIキー">

        <input
            id="channelId"
            type="text"
            placeholder="チャンネルID（UC...）">

        <button
            id="loadButton"
            onclick="loadChannel()">
            読み込み
        </button>

    </div>
</header>

<main>

    <div id="result"></div>

</main>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

const API_BASE =
    "https://www.googleapis.com/youtube/v3";

let videos = [];
let subscriberCount = 0;

async function apiRequest(endpoint, params) {

    const query =
        new URLSearchParams(params);

    const response =
        await fetch(
            `${API_BASE}/${endpoint}?${query}`
        );

    const data =
        await response.json();

    if (!response.ok) {
        throw new Error(
            data.error?.message ||
            "APIリクエストに失敗した"
        );
    }

    return data;
}

function formatNumber(value) {

    return Number(value)
        .toLocaleString("ja-JP");
}

function formatDate(dateString) {

    const date =
        new Date(dateString);

    return date.toLocaleDateString(
        "ja-JP",
        {
            year: "numeric",
            month: "2-digit",
            day: "2-digit"
        }
    );
}

function daysBetween(date1, date2) {

    const time1 =
        new Date(date1).getTime();

    const time2 =
        new Date(date2).getTime();

    return Math.floor(
        (time1 - time2) / 86400000
    );
}

function formatDays(days) {

    if (days === 0) {
        return "同日";
    }

    if (days === 1) {
        return "1日";
    }

    return `${days}日`;
}

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}

function parseDuration(duration) {

    const match =
        duration.match(
            /PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/
        );

    if (!match) {
        return 0;
    }

    const hours =
        Number(match[1] || 0);

    const minutes =
        Number(match[2] || 0);

    const seconds =
        Number(match[3] || 0);

    return (
        hours * 3600 +
        minutes * 60 +
        seconds
    );
}

async function loadChannel() {

    const apiKey =
        document
            .getElementById("apiKey")
            .value
            .trim();

    const channelId =
        document
            .getElementById("channelId")
            .value
            .trim();

    const result =
        document.getElementById("result");

    const button =
        document.getElementById("loadButton");

    if (!apiKey || !channelId) {

        result.innerHTML = `
            <div class="error">
                APIキーとチャンネルIDを入力して
            </div>
        `;

        return;
    }

    button.disabled = true;

    result.innerHTML = `
        <div class="loading">
            YouTubeからデータを取得中...
        </div>
    `;

    try {

        /*
         * チャンネル情報取得
         */
        const channelData =
            await apiRequest(
                "channels",
                {
                    part:
                        "snippet,statistics,contentDetails",

                    id:
                        channelId,

                    key:
                        apiKey
                }
            );

        if (
            !channelData.items ||
            channelData.items.length === 0
        ) {
            throw new Error(
                "チャンネルが見つからない"
            );
        }

        const channel =
            channelData.items[0];

        subscriberCount =
            Number(
                channel.statistics
                    .subscriberCount
            );

        /*
         * アップロード動画プレイリスト取得
         */
        const uploadsPlaylistId =
            channel.contentDetails
                .relatedPlaylists
                .uploads;

        const playlistData =
            await apiRequest(
                "playlistItems",
                {
                    part:
                        "snippet,contentDetails",

                    playlistId:
                        uploadsPlaylistId,

                    maxResults:
                        50,

                    key:
                        apiKey
                }
            );

        const videoIds =
            playlistData.items.map(
                item =>
                    item.contentDetails
                        .videoId
            );

        if (videoIds.length === 0) {
            throw new Error(
                "動画が見つからない"
            );
        }

        /*
         * 動画詳細取得
         */
        const videoData =
            await apiRequest(
                "videos",
                {
                    part:
                        "snippet,statistics,contentDetails",

                    id:
                        videoIds.join(","),

                    key:
                        apiKey
                }
            );

        /*
         * 横動画を取得
         *
         * #shortsを除外し、
         * 60秒以下の動画も除外
         */
        videos =
            videoData.items
                .filter(video => {

                    const title =
                        video.snippet.title
                            .toLowerCase();

                    const description =
                        video.snippet.description
                            .toLowerCase();

                    const isShort =
                        title.includes(
                            "#shorts"
                        ) ||
                        description.includes(
                            "#shorts"
                        );

                    const seconds =
                        parseDuration(
                            video.contentDetails
                                .duration
                        );

                    return (
                        !isShort &&
                        seconds > 60
                    );
                })
                .sort((a, b) => {

                    return (
                        new Date(
                            b.snippet
                                .publishedAt
                        ) -

                        new Date(
                            a.snippet
                                .publishedAt
                        )
                    );
                })
                .slice(0, 20);

        renderChannel(channel);
        renderVideos();
        renderChart();

    } catch (error) {

        result.innerHTML = `
            <div class="error">
                <strong>エラー</strong><br>
                ${escapeHtml(
                    error.message
                )}
            </div>
        `;

    } finally {

        button.disabled = false;
    }
}

function renderChannel(channel) {

    const result =
        document.getElementById("result");

    result.innerHTML = `

        <div class="channel">

            <div class="channel-name">
                ${escapeHtml(
                    channel.snippet.title
                )}
            </div>

            <div class="subscribers">

                現在のチャンネル登録者数：
                
                <strong>
                    ${formatNumber(
                        subscriberCount
                    )}
                </strong>

            </div>

        </div>

        <div class="chart-container">

            <h2>
                動画ごとの統計
            </h2>

            <div class="chart-wrapper">

                <canvas
                    id="videoChart">
                </canvas>

            </div>

        </div>

        <div
            class="video-list"
            id="videoList">
        </div>
    `;
}

function renderVideos() {

    const list =
        document.getElementById(
            "videoList"
        );

    list.innerHTML =
        videos.map(
            (video, index) => {

                const statistics =
                    video.statistics;

                const views =
                    Number(
                        statistics
                            .viewCount ||
                        0
                    );

                const likes =
                    Number(
                        statistics
                            .likeCount ||
                        0
                    );

                const publishedAt =
                    video.snippet
                        .publishedAt;

                let gapText =
                    "最初の動画";

                if (
                    index <
                    videos.length - 1
                ) {

                    const previousVideo =
                        videos[index + 1];

                    const gap =
                        daysBetween(
                            publishedAt,
                            previousVideo
                                .snippet
                                .publishedAt
                        );

                    gapText =
                        `前の動画から ${formatDays(gap)}`;
                }

                const thumbnail =
                    video.snippet
                        .thumbnails
                        .high?.url ||
                    video.snippet
                        .thumbnails
                        .medium?.url ||
                    video.snippet
                        .thumbnails
                        .default
                        .url;

                return `

                    <div class="video">

                        <a
                            href="https://www.youtube.com/watch?v=${video.id}"
                            target="_blank"
                            rel="noopener noreferrer">

                            <img
                                class="thumbnail"
                                src="${thumbnail}"
                                alt="">
                        </a>

                        <div>

                            <div class="title">

                                ${index + 1}.
                                ${escapeHtml(
                                    video.snippet
                                        .title
                                )}

                            </div>

                            <div class="info">

                                <span>
                                    ▶ 再生
                                    <strong>
                                        ${formatNumber(
                                            views
                                        )}
                                    </strong>
                                </span>

                                <span>
                                    👍 高評価
                                    <strong>
                                        ${formatNumber(
                                            likes
                                        )}
                                    </strong>
                                </span>

                            </div>

                            <div class="date">

                                投稿日：
                                ${formatDate(
                                    publishedAt
                                )}

                            </div>

                            <div class="gap">

                                ${gapText}

                            </div>

                        </div>

                    </div>
                `;
            }
        ).join("");
}

function renderChart() {

    const canvas =
        document.getElementById(
            "videoChart"
        );

    const labels =
        videos.map(
            (video, index) =>
                `${index + 1}`
        );

    const viewData =
        videos.map(
            video =>
                Number(
                    video.statistics
                        .viewCount ||
                    0
                )
        );

    const likeData =
        videos.map(
            video =>
                Number(
                    video.statistics
                        .likeCount ||
                    0
                )
        );

    const subscriberData =
        videos.map(
            () =>
                subscriberCount
        );

    new Chart(
        canvas,
        {
            data: {

                labels: labels,

                datasets: [

                    {
                        type: "bar",

                        label:
                            "再生数",

                        data:
                            viewData,

                        yAxisID:
                            "y"
                    },

                    {
                        type: "bar",

                        label:
                            "高評価数",

                        data:
                            likeData,

                        yAxisID:
                            "y"
                    },

                    {
                        type: "line",

                        label:
                            "チャンネル登録者数",

                        data:
                            subscriberData,

                        yAxisID:
                            "y1",

                        tension:
                            0.2,

                        pointRadius:
                            4
                    }

                ]
            },

            options: {

                responsive:
                    true,

                maintainAspectRatio:
                    false,

                interaction: {

                    mode:
                        "index",

                    intersect:
                        false
                },

                scales: {

                    x: {

                        title: {

                            display:
                                true,

                            text:
                                "動画（新しい順）"
                        }
                    },

                    y: {

                        beginAtZero:
                            true,

                        title: {

                            display:
                                true,

                            text:
                                "再生数・高評価数"
                        }
                    },

                    y1: {

                        position:
                            "right",

                        beginAtZero:
                            true,

                        grid: {

                            drawOnChartArea:
                                false
                        },

                        title: {

                            display:
                                true,

                            text:
                                "チャンネル登録者数"
                        }
                    }
                },

                plugins: {

                    tooltip: {

                        callbacks: {

                            title:
                                function(context) {

                                    const index =
                                        context[0]
                                            .dataIndex;

                                    return (
                                        videos[index]
                                            .snippet
                                            .title
                                    );
                                },

                            label:
                                function(context) {

                                    return (
                                        `${context.dataset.label}: ` +
                                        formatNumber(
                                            context.raw
                                        )
                                    );
                                }
                        }
                    },

                    legend: {

                        display:
                            true
                    }
                }
            }
        }
    );
}

</script>

</body>
</html>
