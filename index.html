
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>舟形多円錐図法 計算機</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 30px auto; padding: 0 16px; }
        input, button { font-size: 16px; padding: 8px; }
        input { width: 120px; }
        table { border-collapse: collapse; width: 100%; margin-top: 16px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
        th { background: #eee; }
        .result { margin-top: 20px; padding: 12px; background: #f2f6fa; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>舟形多円錐図法 計算機</h1>

    <p>半径：3 cm</p>

    <label for="height">高さ（cm）：</label>
    <input type="number" id="height" value="1" min="0" max="4.71238898" step="0.01">
    <button onclick="calculate()">計算</button>

    <div class="result">
        <p>緯度：<strong id="latitude">-</strong></p>
        <p>幅：<strong id="width">-</strong> cm</p>
    </div>

    <h2>高さと緯度・幅の対応表</h2>
    <table>
        <thead>
            <tr>
                <th>高さ (cm)</th>
                <th>緯度 (°)</th>
                <th>幅 (cm)</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <script>
        const R = 3;
        const MAX_HEIGHT = R * Math.PI / 2;

        function heightFromLatitude(phi) {
            if (Math.abs(phi) < 1e-8) return 0;
            if (Math.abs(Math.abs(phi) - Math.PI / 2) < 1e-8) return Math.sign(phi) * MAX_HEIGHT;

            return R * (phi + (1 / Math.tan(phi)) * (1 - Math.cos(Math.PI / 12 * Math.sin(phi))));
        }

        function widthFromLatitude(phi) {
            if (Math.abs(phi) < 1e-8) return Math.PI / 2;
            if (Math.abs(Math.abs(phi) - Math.PI / 2) < 1e-8) return 0;

            return 2 * R * (1 / Math.tan(phi)) * Math.sin(Math.PI / 12 * Math.sin(phi));
        }

        function latitudeFromHeight(height) {
            if (height <= 0) return 0;
            if (height >= MAX_HEIGHT) return Math.PI / 2;

            let low = 0;
            let high = Math.PI / 2;

            for (let i = 0; i < 100; i++) {
                const mid = (low + high) / 2;

                if (heightFromLatitude(mid) < height) low = mid;
                else high = mid;
            }

            return (low + high) / 2;
        }

        function calculate() {
            const height = Number(document.getElementById("height").value);

            if (!Number.isFinite(height) || height < 0 || height > MAX_HEIGHT) {
                alert(`高さは0～${MAX_HEIGHT.toFixed(4)} cmで入力してね`);
                return;
            }

            const phi = latitudeFromHeight(height);
            const latitude = phi * 180 / Math.PI;
            const width = widthFromLatitude(phi);

            document.getElementById("latitude").textContent = latitude.toFixed(4) + "°";
            document.getElementById("width").textContent = width.toFixed(4);
        }

        function createTable() {
            const tbody = document.getElementById("tableBody");

            for (let height = 0; height < MAX_HEIGHT; height += 0.5) {
                const phi = latitudeFromHeight(height);
                const latitude = phi * 180 / Math.PI;
                const width = widthFromLatitude(phi);
                const tr = document.createElement("tr");

                tr.innerHTML = `<td>${height.toFixed(1)}</td><td>${latitude.toFixed(4)}°</td><td>${width.toFixed(4)}</td>`;
                tbody.appendChild(tr);
            }

            const phi = Math.PI / 2;
            const tr = document.createElement("tr");
            tr.innerHTML = `<td>${MAX_HEIGHT.toFixed(4)}</td><td>90.0000°</td><td>${widthFromLatitude(phi).toFixed(4)}</td>`;
            tbody.appendChild(tr);
        }

        calculate();
        createTable();
    </script>
</body>
</html>
